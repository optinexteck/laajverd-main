    <!-- card -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOM fully loaded and parsed");

        const cards = document.querySelectorAll(".library");
        const materialFilter = document.getElementById("materialFilter");
        const locationFilter = document.getElementById("locationFilter");
        const supportedByFilter = document.getElementById("supportedByFilter");
        const yearFilter = document.getElementById("yearFilter");
        const searchInput = document.querySelector('input[type="text"]');

        // Function to get query parameter by name
        function getQueryParam(name) {
          const urlParams = new URLSearchParams(window.location.search);
          return urlParams.get(name);
        }

        // Get all query parameters
        const locationParam = getQueryParam("location");
        const titleParam = getQueryParam("title");

        // Hide all libraries by default
        function hideAllCards() {
          const libraries = document.querySelectorAll(".library");
          libraries.forEach((library) => {
            library.style.display = "none";
          });
        }

        // Initial hide
        hideAllCards();

        // Function to check if a card matches all criteria
        function doesCardMatch(card) {
          const cardLocation =
            card.getAttribute("data-location")?.toLowerCase() || "";
          const cardTitle =
            card.querySelector(".heading h1")?.textContent.toLowerCase() || "";

          // Check URL parameters first
          if (locationParam) {
            const locationMatch = cardLocation.includes(
              locationParam.toLowerCase()
            );
            if (!locationMatch) return false;
          }

          if (titleParam) {
            const titleMatch = cardTitle.includes(titleParam.toLowerCase());
            if (!titleMatch) return false;
          }

          // Check filter values
          const materialValue = materialFilter.value.toLowerCase();
          const locationValue = locationFilter.value.toLowerCase();
          const supportedByValue = supportedByFilter.value.toLowerCase();
          const yearValue = yearFilter.value.toLowerCase();
          const searchValue = searchInput.value.toLowerCase();

          const cardMaterial =
            card.getAttribute("data-material")?.toLowerCase() || "";
          const cardSupportedBy =
            card.getAttribute("data-supported-by")?.toLowerCase() || "";
          const cardYear = card.getAttribute("data-year")?.toLowerCase() || "";

          return (
            (materialValue === "" || cardMaterial.includes(materialValue)) &&
            (locationValue === "" || cardLocation.includes(locationValue)) &&
            (supportedByValue === "" ||
              cardSupportedBy.includes(supportedByValue)) &&
            (yearValue === "" || cardYear.includes(yearValue)) &&
            (searchValue === "" || cardTitle.includes(searchValue))
          );
        }

        // Update filterCards function
        function filterCards() {
          hideAllCards();

          const libraries = document.querySelectorAll(".library");
          libraries.forEach((library) => {
            if (doesCardMatch(library)) {
              library.style.display = "block";
            }
          });
        }

        // Set initial filter values from URL parameters
        if (locationParam) {
          if (locationParam === "Skardu") {
            locationFilter.value = "Gilgit";
          } else {
            locationFilter.value =
              locationParam.charAt(0).toUpperCase() +
              locationParam.slice(1).toLowerCase();
          }
        }

        if (titleParam) {
          searchInput.value = titleParam;
        }

        // Initial filter application
        filterCards();

        // Add event listeners
        materialFilter.addEventListener("change", filterCards);
        locationFilter.addEventListener("change", filterCards);
        supportedByFilter.addEventListener("change", filterCards);
        yearFilter.addEventListener("change", filterCards);
        searchInput.addEventListener("input", filterCards);
      });
    </script>

    <script type="module">
      // Import the required Firebase modules
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        query,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCjA3GI1FC6_wikAy6qMw8hk4ZXDPsgw1U",
        authDomain: "laajverd-42a3f.firebaseapp.com",
        projectId: "laajverd-42a3f",
        storageBucket: "laajverd-42a3f.appspot.com",
        messagingSenderId: "654657065769",
        appId: "1:654657065769:web:9cff527bd2a4ec6a9f1d38",
        measurementId: "G-ZS0JV6362J",
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      console.log("Firebase initialized");

      // Function to fetch and display archive entries
      function fetchArchiveEntries() {
        console.log("Fetching archive entries...");
        const archiveQuery = query(collection(db, "archive"));

        // Get location from URL query parameter
        const locationParam = new URLSearchParams(window.location.search).get(
          "location"
        );
        console.log("Location from URL:", locationParam);

        onSnapshot(
          archiveQuery,
          (querySnapshot) => {
            console.log(
              "Snapshot received, document count:",
              querySnapshot.size
            );

            const archiveData = [];
            // Filter documents based on location
            querySnapshot.docs.forEach((doc) => {
              const data = doc.data();
              // Only include documents that match the location parameter
              if (locationParam && data.location) {
                // Handle the special case for Skardu
                const matchesLocation =
                  locationParam.toLowerCase() === "skardu"
                    ? data.location.toLowerCase() === "gilgit"
                    : data.location.toLowerCase() ===
                      locationParam.toLowerCase();

                if (matchesLocation) {
                  archiveData.push(data);
                }
              }
            });

            console.log("Matching archive entries:", archiveData.length);

            const container = document.querySelector("main");
            if (!container) {
              console.error("Main container not found!");
              return;
            }

            // Clear existing library entries before adding new ones
            const existingLibraries = container.querySelectorAll(".library");
            existingLibraries.forEach((lib) => lib.remove());

            // Add only the matching entries
            archiveData.forEach((item, index) => {
              console.log(`Processing matching item ${index + 1}:`, item);

              const collectionHTML = `
                <div class="library" 
                     data-material="${item.material || ""}" 
                     data-location="${item.location || ""}" 
                     data-supported-by="${item.supportedBy || ""}" 
                     data-year="${item.year || ""}"
                     style="display: block;">  <!-- Show matching items by default -->
              <div class="line"></div>
              <div class="libHeading" style="width: 100%">
                <div class="lft">
                  <div class="heading">
                        <p>${item.location || ""}</p>
                        <h1>${item.title || ""}</h1>
                  </div>
                </div>
                <div class="rght">
                      <p>Introductory Text : ${item.introductoryText || ""}</p>
                      <p>Insights : ${item.insight || ""}</p>
                      <h6>Our Conversation Approach</h6>
                      <p> ${item.approach || ""}</p>
                      <h6>Region History</h6>
                      <p> ${item.regionHistory || ""}</p>
                  <h6>Material</h6>
                      <p>${item.material || ""}</p>
                      <h6>Asset</h6>
                      <p>${item.asset || ""}</p>
                </div>
              </div>
            </div>
          `;
              container.insertAdjacentHTML("beforeend", collectionHTML);
            });

            console.log("All matching entries added to container");

            // Set the location filter to match the URL parameter
            if (locationParam) {
              const locationFilter = document.getElementById("locationFilter");
              if (locationFilter) {
                locationFilter.value =
                  locationParam === "skardu"
                    ? "Gilgit"
                    : locationParam.charAt(0).toUpperCase() +
                      locationParam.slice(1).toLowerCase();
              }
            }

            initializeFilters();
          },
          (error) => {
            console.error("Error fetching archive entries:", error);
          }
        );
      }

      // Initialize filters after content is loaded
      function initializeFilters() {
        const cards = document.querySelectorAll(".library");
        console.log("Number of cards found:", cards.length);

        const materialFilter = document.getElementById("materialFilter");
        const locationFilter = document.getElementById("locationFilter");
        const supportedByFilter = document.getElementById("supportedByFilter");
        const yearFilter = document.getElementById("yearFilter");

        if (
          !materialFilter ||
          !locationFilter ||
          !supportedByFilter ||
          !yearFilter
        ) {
          console.error("One or more filters not found!"); // Debug error
          return;
        }

        // Add your existing filter logic here
        function filterCards() {
          console.log("Filtering cards...");
          const materialValue = materialFilter.value.toLowerCase();
          const locationValue = locationFilter.value.toLowerCase();
          const supportedByValue = supportedByFilter.value.toLowerCase();
          const yearValue = yearFilter.value.toLowerCase();

          console.log("Filter values:", {
            material: materialValue,
            location: locationValue,
            supportedBy: supportedByValue,
            year: yearValue,
          });

          let visibleCount = 0;
          cards.forEach((card) => {
            const cardMaterial =
              card.getAttribute("data-material")?.toLowerCase() || "";
            const cardLocation =
              card.getAttribute("data-location")?.toLowerCase() || "";
            const cardSupportedBy =
              card.getAttribute("data-supported-by")?.toLowerCase() || "";
            const cardYear =
              card.getAttribute("data-year")?.toLowerCase() || "";

            const matchesMaterial =
              materialValue === "" || cardMaterial.includes(materialValue);
            const matchesLocation =
              locationValue === "" || cardLocation.includes(locationValue);
            const matchesSupportedBy =
              supportedByValue === "" ||
              cardSupportedBy.includes(supportedByValue);
            const matchesYear =
              yearValue === "" || cardYear.includes(yearValue);

            const isVisible =
              matchesMaterial &&
              matchesLocation &&
              matchesSupportedBy &&
              matchesYear;
            card.style.display = isVisible ? "block" : "none";
            if (isVisible) visibleCount++;
          });

          console.log("Visible cards after filtering:", visibleCount);
        }

        // Add event listeners for filters
        materialFilter.addEventListener("change", filterCards);
        locationFilter.addEventListener("change", filterCards);
        supportedByFilter.addEventListener("change", filterCards);
        yearFilter.addEventListener("change", filterCards);

        console.log("Filter event listeners added");
      }

      // Fetch data when the page loads
      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOM Content Loaded, starting data fetch...");
        fetchArchiveEntries();
      });
    </script>
