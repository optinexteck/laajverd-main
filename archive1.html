    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const header = document.querySelector(".header");
        const logo = document.querySelector(".logo");
        const heading = document.querySelector(".logo h2");
        let lastScrollTop = 0;

        window.addEventListener("scroll", function () {
          let scrollTop =
            window.pageYOffset || document.documentElement.scrollTop;
          if (scrollTop > lastScrollTop) {
            // Scrolling down
            header.classList.add("invisible");
            logo.classList.add("invisible");
            heading.classList.add("invisible");
          } else {
            // Scrolling up
            header.classList.remove("invisible");
            logo.classList.remove("invisible");
            heading.classList.remove("invisible");
          }
          lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; // For Mobile or negative scrolling
        });

        header.addEventListener("mouseenter", function () {
          header.classList.remove("invisible");
          logo.classList.remove("invisible");
          heading.classList.remove("invisible");
        });

        header.addEventListener("mouseleave", function () {
          if (window.pageYOffset > 0) {
            header.classList.add("invisible");
            logo.classList.add("invisible");
            heading.classList.add("invisible");
          }
        });

        // Mobile menu toggle
        document
          .querySelector(".mobile-nav-toggle")
          .addEventListener("click", function () {
            document
              .querySelector(".navmenu")
              .classList.toggle("mobile-nav-active");
          });
      });
    </script>
    <script>
      // searching code

      var search;
      const dropdown = document.querySelectorAll(".form-select");
      const allCards = document.querySelectorAll(".archive-card");
      const mainElement = document.getElementById("main");
      const footer = document.getElementById("footer");
      const searchButton = document.getElementById("search");
      const resetButton = document.getElementById("reset");
      const searchInput = document.getElementById("search-input");

      function adjustFooter() {
        const mainHeight = mainElement.offsetHeight;
        console.log("Current main height:", mainHeight);

        if (mainHeight < 900) {
          footer.style.position = "fixed";
          footer.style.bottom = "0";
          footer.style.width = "100%";
        } else {
          footer.style.position = "relative";
          footer.style.width = "100%";
        }
      }

      // For dropdowns
      dropdown.forEach((list, index) => {
        list.addEventListener("change", (e) => {
          search = e.target.value.toLowerCase();
          allCards.forEach((card) => {
            const data = card.textContent.toLowerCase();
            if (!data.includes(search) && search !== "") {
              card.classList.add("hidden");
            } else {
              card.classList.remove("hidden");
            }
          });
          setTimeout(adjustFooter, 100);
        });
      });

      // For search button
      searchButton.addEventListener("click", () => {
        search = searchInput.value.toLowerCase();
        allCards.forEach((card) => {
          const data = card.textContent.toLowerCase();
          if (!data.includes(search) && search !== "") {
            card.classList.add("hidden");
          } else {
            card.classList.remove("hidden");
          }
        });
        setTimeout(adjustFooter, 100);
      });

      // For reset button
      resetButton.addEventListener("click", () => {
        location.reload();
      });

      // For search on enter key
      searchInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          search = searchInput.value.toLowerCase();
          allCards.forEach((card) => {
            const data = card.textContent.toLowerCase();
            if (!data.includes(search) && search !== "") {
              card.classList.add("hidden");
            } else {
              card.classList.remove("hidden");
            }
          });
          setTimeout(adjustFooter, 100);
        }
      });

      // Initial footer adjustment
      adjustFooter();

      // Keep your existing article click functionality
      const sideTitle = document.getElementById("side-title");
      document.querySelectorAll(".archive-card").forEach((article) => {
        article.addEventListener("click", function (event) {
          event.preventDefault();
          const title =
            article.querySelector(".post-title")?.textContent ||
            "Title not found";
          const location =
            article.querySelector(".location-text")?.textContent ||
            "Location not found";
          const assets =
            article.querySelector(".assets-text")?.textContent ||
            "Assets not found";
          const material =
            article.querySelector(".material-text")?.textContent ||
            "Material not found";
          const category =
            article.querySelector(".post-category")?.textContent ||
            "Category not found";
          const author =
            article.querySelector(".post-author")?.textContent ||

          const date =

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        query,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCjA3GI1FC6_wikAy6qMw8hk4ZXDPsgw1U",
        authDomain: "laajverd-42a3f.firebaseapp.com",
        projectId: "laajverd-42a3f",
        storageBucket: "laajverd-42a3f.appspot.com",
        messagingSenderId: "654657065769",
        appId: "1:654657065769:web:9cff527bd2a4ec6a9f1d38",
        measurementId: "G-ZS0JV6362J",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      var cardsData = [];
      function fetchData() {
        const mapQuery = query(collection(db, "archive1"));
        onSnapshot(mapQuery, (querySnapshot) => {
          cardsData = []; // Clear the array before adding new data
          querySnapshot.docs.forEach((doc) => {
            const data = doc.data();
            cardsData.push(data);
            console.log("Fetched data:", data);
          });
          generateCards(); // Call generateCards after data is fetched
        });
      }

      let currentPage = 1;
      const cardsPerPage = 8; // Set to 8 cards per page

      function generateCards(filteredData = cardsData) {
        const container = document.querySelector(".row");
        const container1 = document.querySelector(".row1");
        const container2 = document.querySelector(".row2");

        container.innerHTML = "";

        // Calculate the start and end indices for the current page
        const startIndex = (currentPage - 1) * cardsPerPage;
        const endIndex = startIndex + cardsPerPage;

        // Slice the data to get only the cards for the current page
        const currentCards = filteredData.slice(startIndex, endIndex);

        currentCards.forEach((card,key) => {
          const cardElement = document.createElement("div");
          cardElement.classList.add("archive-card");
          cardElement.innerHTML = `
            <a class="icon-link">
              <i class="bi bi-plus icon open-offcanvas"></i>
            </a>
            <h4 class="post-title">${card.title}</h4>
            <p><strong>Location:</strong> <span class="location-text">${card.location}</span></p>
            <p><strong>Assets:</strong> <span class="assets-text">${card.assets}</span></p>
            <p><strong>Material:</strong> <span class="material-text">${card.material}</span></p>
          `;
          if(key <=3){
            container2.appendChild(cardElement);
          }else{
            container1.appendChild(cardElement);
          }
        });

        // Add event listeners for icon links
        document.querySelectorAll(".icon-link").forEach((iconLink) => {
          iconLink.addEventListener("click", function (event) {
            event.preventDefault();
            const card = this.closest(".archive-card");
            const title = card.querySelector(".post-title").textContent.trim();
            const location = card.querySelector(".location-text").textContent.trim();
            const assets = card.querySelector(".assets-text").textContent.trim();
            const material = card.querySelector(".material-text").textContent.trim();
            const encodedTitle = title.split(" ")[0];
            const newUrl = `/archive-map.html?title=${encodedTitle}&location=${location}&assets=${assets}&material=${material}`;
            window.location.href = newUrl;
          });
        });

        updatePagination(filteredData.length);
      }

      function updatePagination(totalCards) {
        const paginationContainer = document.querySelector(".pagination");
        paginationContainer.innerHTML = ""; // Clear existing pagination

        const totalPages = Math.ceil(totalCards / cardsPerPage);

        // Create previous button
        const prevButton = document.createElement("a");
        prevButton.href = "#";
        prevButton.innerHTML = "&laquo;";
        prevButton.addEventListener("click", (e) => {
          e.preventDefault();
          if (currentPage > 1) {
            currentPage--;
            generateCards();
          }
        });
        paginationContainer.appendChild(prevButton);

        // Create page number buttons
        for (let i = 1; i <= totalPages; i++) {
          const pageButton = document.createElement("a");
          pageButton.href = "#";
          pageButton.textContent = i;
          if (i === currentPage) {
            pageButton.classList.add("active");
          }
          pageButton.addEventListener("click", (e) => {
            e.preventDefault();
            currentPage = i;
            generateCards();
          });
          paginationContainer.appendChild(pageButton);
        }

        // Create next button
        const nextButton = document.createElement("a");
        nextButton.href = "#";
        nextButton.innerHTML = "&raquo;";
        nextButton.addEventListener("click", (e) => {
          e.preventDefault();
          if (currentPage < totalPages) {
            currentPage++;
            generateCards();
          }
        });
        paginationContainer.appendChild(nextButton);
      }

      // Function to filter cards based on selected filters
      function filterCards() {
        const accessLevelSelect = document.querySelector('select[name="accessLevel"]');
        const collectionTypeSelect = document.querySelector('select[name="collectionType"]');
        const contentTypeSelect = document.querySelector('select[name="contentType"]');
        const formatTypeSelect = document.querySelector('select[name="formatType"]');

        const accessLevel = accessLevelSelect ? accessLevelSelect.value.toLowerCase() : '';
        const collectionType = collectionTypeSelect ? collectionTypeSelect.value.toLowerCase() : '';
        const contentType = contentTypeSelect ? contentTypeSelect.value.toLowerCase() : '';
        const formatType = formatTypeSelect ? formatTypeSelect.value.toLowerCase() : '';

        const filteredData = cardsData.filter(card => {
          const cardAccessLevel = card.accessLevel.toLowerCase();
          const cardCollectionType = card.collectionType.toLowerCase();
          const cardContentType = card.contentType.toLowerCase();
          const cardFormatType = card.formatType.toLowerCase();

          return (
            (accessLevel === '' || cardAccessLevel === accessLevel) &&
            (collectionType === '' || cardCollectionType === collectionType) &&
            (contentType === '' || cardContentType === contentType) &&
            (formatType === '' || cardFormatType === formatType)
          );
        });

        currentPage = 1; // Reset to the first page after filtering
        generateCards(filteredData);
      }

      // Add event listeners to filter elements
      document.querySelectorAll('select').forEach((select) => {
        select.addEventListener('change', filterCards);
      });

      // Fetch data on page load
      document.addEventListener("DOMContentLoaded", fetchData);
    </script>

    <script>
      $(document).ready(function() {
        // Initialize Select2 on all multiselect elements with custom placeholders
        $('#location').select2({
          placeholder: "Location",
          allowClear: true,
          width: '250px'
        });

        $('#asset').select2({
          placeholder: "Asset Type",
          allowClear: true,
          width: '250px'
        });

        $('#material').select2({
          placeholder: "Material",
          allowClear: true,
          width: '250px'
        });

        // Function to filter cards based on selected values
        function filterCards() {
          const locationValues = $('#location').val() || [];
          const assetValues = $('#asset').val() || [];
          const materialValues = $('#material').val() || [];

          $('.archive-card').each(function() {
            const card = $(this);
            const cardLocation = card.find('p:contains("Location:")').text().toLowerCase();
            const cardAsset = card.find('p:contains("Assets:")').text().toLowerCase();
            const cardMaterial = card.find('p:contains("Material:")').text().toLowerCase();

            const matchesLocation = locationValues.length === 0 || 
              locationValues.some(val => cardLocation.includes(val.toLowerCase()));
            const matchesAsset = assetValues.length === 0 || 
              assetValues.some(val => cardAsset.includes(val.toLowerCase()));
            const matchesMaterial = materialValues.length === 0 || 
              materialValues.some(val => cardMaterial.includes(val.toLowerCase()));

            if (matchesLocation && matchesAsset && matchesMaterial) {
              card.show();
            } else {
              card.hide();
            }
          });

          // Adjust footer after filtering
          adjustFooter();
        }

        // Add event listener for search button
        $('#search').click(filterCards);
        
        // Reset button handler
        $('#reset').click(function() {
          $('.multiselect').val(null).trigger('change');
          $('.archive-card').show();
          adjustFooter();
        });

        // Add some basic styles for the filter section
        $('<style>')
          .text(`
            .filter-group {
              margin-bottom: 15px;
            }
            .select2-container {
              margin-bottom: 10px;
            }
            .select2-container--default .select2-selection--multiple .select2-selection__placeholder {
              color: #495057;
              font-weight: 500;
            }
            .archiveBtn {
              padding: 8px 16px;
              border-radius: 25px;
              font-size: 14px;
            }
            .filters {
              padding: 20px;
              border-radius: 8px;
              margin-bottom: 30px;
            }
          `)
          .appendTo('head');
      });
    </script>
