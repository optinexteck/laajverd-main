    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const header = document.querySelector(".header");
        const logo = document.querySelector(".logo");
        const heading = document.querySelector(".logo h2");
        let lastScrollTop = 0;

        window.addEventListener("scroll", function () {
          let scrollTop =
            window.pageYOffset || document.documentElement.scrollTop;
          if (scrollTop > lastScrollTop) {
            // Scrolling down
            header.classList.add("invisible");
            logo.classList.add("invisible");
            heading.classList.add("invisible");
          } else {
            // Scrolling up
            header.classList.remove("invisible");
            logo.classList.remove("invisible");
            heading.classList.remove("invisible");
          }
          lastScrollTop = scrollTop <= 0 ? 0 : scrollTop; // For Mobile or negative scrolling
        });

        header.addEventListener("mouseenter", function () {
          header.classList.remove("invisible");
          logo.classList.remove("invisible");
          heading.classList.remove("invisible");
        });

        header.addEventListener("mouseleave", function () {
          if (window.pageYOffset > 0) {
            header.classList.add("invisible");
            logo.classList.add("invisible");
            heading.classList.add("invisible");
          }
        });

        // Mobile menu toggle
        document
          .querySelector(".mobile-nav-toggle")
          .addEventListener("click", function () {
            document
              .querySelector(".navmenu")
              .classList.toggle("mobile-nav-active");
          });
      });
    </script>
    <script>
      // searching code

      var search;
      const dropdown = document.querySelectorAll(".form-select");
      const allCards = document.querySelectorAll(".archive-card");
      const mainElement = document.getElementById("main");
      const footer = document.getElementById("footer");
      const searchButton = document.getElementById("search");
      const resetButton = document.getElementById("reset");
      const searchInput = document.getElementById("search-input");

      function adjustFooter() {
        const mainHeight = mainElement.offsetHeight;
        console.log("Current main height:", mainHeight);

        if (mainHeight < 900) {
          footer.style.position = "fixed";
          footer.style.bottom = "0";
          footer.style.width = "100%";
        } else {
          footer.style.position = "relative";
          footer.style.width = "100%";
        }
      }

      // For dropdowns
      dropdown.forEach((list, index) => {
        list.addEventListener("change", (e) => {
          search = e.target.value.toLowerCase();
          allCards.forEach((card) => {
            const data = card.textContent.toLowerCase();
            if (!data.includes(search) && search !== "") {
              card.classList.add("hidden");
            } else {
              card.classList.remove("hidden");
            }
          });
          setTimeout(adjustFooter, 100);
        });
      });

      // For search button
      searchButton.addEventListener("click", () => {
        search = searchInput.value.toLowerCase();
        allCards.forEach((card) => {
          const data = card.textContent.toLowerCase();
          if (!data.includes(search) && search !== "") {
            card.classList.add("hidden");
          } else {
            card.classList.remove("hidden");
          }
        });
        setTimeout(adjustFooter, 100);
      });

      // For reset button
      resetButton.addEventListener("click", () => {
        location.reload();
      });

      // For search on enter key
      searchInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          search = searchInput.value.toLowerCase();
          allCards.forEach((card) => {
            const data = card.textContent.toLowerCase();
            if (!data.includes(search) && search !== "") {
              card.classList.add("hidden");
            } else {
              card.classList.remove("hidden");
            }
          });
          setTimeout(adjustFooter, 100);
        }
      });

      // Initial footer adjustment
      adjustFooter();

      // Keep your existing article click functionality
      const sideTitle = document.getElementById("side-title");
      document.querySelectorAll(".archive-card").forEach((article) => {
        article.addEventListener("click", function (event) {
          event.preventDefault();
          const title =
            article.querySelector(".post-title")?.textContent ||
            "Title not found";
          const category =
            article.querySelector(".post-category")?.textContent ||
            "Category not found";
          const author =
            article.querySelector(".post-author")?.textContent ||
            "Author not found";
          const date =
            article.querySelector(".post-date")?.textContent ||
            "Date not found";
          const postImg =
            article.querySelector(".post-img img")?.src ||
            "Post image not found";
          const authorImg =
            article.querySelector(".authorImg")?.src ||
            "Author image not found";

          const queryParams = {
            title,
            category,
            author,
            date,
            postImg,
            authorImg,
          };
          if (sideTitle) {
            sideTitle.innerText = queryParams.title;
          }
          console.log(queryParams);
        });
      });
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        query,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

      // Firebase Configuration
      const firebaseConfig = {
        apiKey: "AIzaSyCjA3GI1FC6_wikAy6qMw8hk4ZXDPsgw1U",
        authDomain: "laajverd-42a3f.firebaseapp.com",
        projectId: "laajverd-42a3f",
        storageBucket: "laajverd-42a3f.appspot.com",
        messagingSenderId: "654657065769",
        appId: "1:654657065769:web:9cff527bd2a4ec6a9f1d38",
        measurementId: "G-ZS0JV6362J",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      var cardsData = [];
      function fetchData() {
        const mapQuery = query(collection(db, "archive1"));
        onSnapshot(mapQuery, (querySnapshot) => {
          cardsData = []; // Clear the array before adding new data
          querySnapshot.docs.forEach((doc) => {
            const data = doc.data();
            cardsData.push(data);
            console.log("Fetched data:", data);
          });
          generateCards(); // Call generateCards after data is fetched
        });
      }

      // Function to generate cards
      function generateCards(filteredData = cardsData) {
        const container = document.querySelector(".row");
        container.innerHTML = ""; // Clear existing content

        filteredData.forEach((card) => {
          const cardElement = document.createElement("div");
          cardElement.classList.add("archive-card");
          cardElement.innerHTML = `
            <a class="icon-link">
              <i class="bi bi-plus icon open-offcanvas"></i>
            </a>
            <h4 class="post-title">${card.title}</h4>
            <p><strong>Location:</strong> ${card.location}</p>
            <p><strong>Assets:</strong> ${card.assets}</p>
            <p><strong>Material:</strong> ${card.material}</p>
          `;
          container.appendChild(cardElement);
        });

        // Add event listeners for icon links
        document.querySelectorAll(".icon-link").forEach((iconLink) => {
          iconLink.addEventListener("click", function (event) {
            event.preventDefault();
            const card = this.closest(".archive-card");
            const title = card.querySelector(".post-title").textContent.trim();
            const encodedTitle = title.split(" ")[0];
            const newUrl = `/archive-map.html?title=${encodedTitle}`;
            window.open(newUrl); // Open in a new tab
          });
        });
      }

      // Function to filter cards
      function filterCards() {
        const locationSelect = document.querySelector('select[name="location"]');
        const assetSelect = document.querySelector('select[name="asset"]');
        const materialSelect = document.querySelector('select[name="material"]');

        if (!locationSelect || !assetSelect || !materialSelect) {
          console.error("One or more select elements not found");
          return;
        }

        const locationFilter = locationSelect.value.toLowerCase();
        const assetFilter = assetSelect.value.toLowerCase();
        const materialFilter = materialSelect.value.toLowerCase();

        console.log("Selected filters:", { locationFilter, assetFilter, materialFilter });

        const filteredData = cardsData.filter(card => {
          const matchesLocation = locationFilter === "location" || card.location.toLowerCase() === locationFilter;
          const matchesAsset = assetFilter === "asset" || card.assets.toLowerCase() === assetFilter;
          const matchesMaterial = materialFilter === "material" || card.material.toLowerCase() === materialFilter;
          return matchesLocation && matchesAsset && matchesMaterial;
        });

        console.log("Filtered data:", filteredData);
        generateCards(filteredData);
      }

      // Add event listeners to filter dropdowns
      document.querySelectorAll('.form-select').forEach(select => {
        select.addEventListener('change', filterCards);
      });

      // Fetch data on page load
      document.addEventListener("DOMContentLoaded", fetchData);
    </script>
